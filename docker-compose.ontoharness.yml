services:
  ontoharness:
    build:
      context: ../ontoharness
      dockerfile: Dockerfile
    container_name: ontoharness-api
    ports:
      - "8010:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
